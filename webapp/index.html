<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ff9500">
  <title>Kabelmeter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button id="chip" class="chip" type="button" aria-haspopup="dialog">
        <span id="chipIcon" class="chip-icon" aria-hidden="true"></span>
        <span class="chip-text">
          <span id="chipTitle" class="chip-title">Laden…</span>
          <span id="chipSub" class="chip-sub"></span>
        </span>
        <span class="chevron" aria-hidden="true">▾</span>
      </button>
      <button id="cartButton" class="round" type="button" aria-label="Winkelmand">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 18a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm10 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4ZM5.2 4l.4 2H21l-2 8H7.4l.4 2H19v2H6.2L3.6 4H1V2h3.8l.4 2Z"/></svg>
        <span id="cartBadge" class="badge" hidden>0</span>
      </button>
    </header>

    <nav class="segmented" aria-label="Modus">
      <button type="button" data-mode="measure" aria-pressed="true">Kabel meten</button>
      <button type="button" data-mode="place" aria-pressed="false">Schakelaars plaatsen</button>
    </nav>

    <p id="status" class="status" role="status" hidden></p>

    <main id="stage">
      <section id="measurePanel" class="panel"></section>
      <section id="placePanel" class="panel" hidden></section>
    </main>

    <div id="crosshair" class="crosshair" hidden aria-hidden="true"><span></span></div>

    <div id="arControls" class="controls" hidden>
      <button id="arUndo" type="button" class="control"><span aria-hidden="true">↶</span>Ongedaan maken</button>
      <button id="arReset" type="button" class="control"><span aria-hidden="true">⟲</span>Opnieuw</button>
      <button id="arAdd" type="button" class="add" aria-label="Punt toevoegen">+</button>
      <button id="arExit" type="button" class="control"><span aria-hidden="true">✓</span>Klaar</button>
    </div>

    <footer id="bar" class="bar"></footer>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>

  <dialog id="picker" class="sheet" aria-labelledby="pickerTitle">
    <div class="sheet-head">
      <h2 id="pickerTitle">Kies</h2>
      <button type="button" class="link" data-close>Sluit</button>
    </div>
    <input id="pickerSearch" class="search" type="search" placeholder="Zoek" autocomplete="off">
    <div id="pickerList" class="list"></div>
  </dialog>

  <dialog id="cart" class="sheet" aria-labelledby="cartTitle">
    <div class="sheet-head">
      <h2 id="cartTitle">Winkelmand</h2>
      <button type="button" class="link" data-close>Klaar</button>
    </div>
    <div id="cartBody"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
